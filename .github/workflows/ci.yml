name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  DATABASE_URL: "postgresql://user:password@localhost:5432/db"
  DIRECT_URL: "postgresql://user:password@localhost:5432/db"
  AUTH_SECRET: "ci-dummy-auth-secret"
  AUTH_URL: "http://localhost:3000"
  STRIPE_SECRET_KEY: "sk_test_dummy"
  STRIPE_WEBHOOK_SECRET: "whsec_dummy"
  NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: "pk_test_dummy"
  CLOUDINARY_CLOUD_NAME: "dummy"
  CLOUDINARY_API_KEY: "dummy"
  CLOUDINARY_API_SECRET: "dummy"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

  # Playwright specs (e2e/) drive a real Postgres database — e2e/db.ts talks
  # to `db` directly to seed/inspect orders, and the app's Prisma client
  # (src/lib/db.ts) is wired to Neon's serverless driver specifically, not a
  # plain TCP connection, so a generic `postgres:` service container here
  # won't work. This job provisions a real, disposable Neon branch per run
  # via Neon's official GitHub Action instead, and always tears it down.
  #
  # Gated on NEON_API_KEY/NEON_PROJECT_ID being configured (see
  # DEPLOYMENT.md) so a fork or a repo that hasn't set these up yet still
  # gets a green build/lint/typecheck/unit-test job instead of a hard
  # failure on missing secrets.
  e2e:
    runs-on: ubuntu-latest
    needs: build
    env:
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
      NEON_PROJECT_ID: ${{ secrets.NEON_PROJECT_ID }}
    steps:
      - name: Checkout
        if: ${{ env.NEON_API_KEY != '' && env.NEON_PROJECT_ID != '' }}
        uses: actions/checkout@v4

      - name: Setup Node.js
        if: ${{ env.NEON_API_KEY != '' && env.NEON_PROJECT_ID != '' }}
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        if: ${{ env.NEON_API_KEY != '' && env.NEON_PROJECT_ID != '' }}
        run: npm ci

      - name: Create ephemeral Neon branch for this run
        if: ${{ env.NEON_API_KEY != '' && env.NEON_PROJECT_ID != '' }}
        id: neon-branch
        uses: neondatabase/create-branch-action@v5
        with:
          project_id: ${{ env.NEON_PROJECT_ID }}
          branch_name: ci-e2e-${{ github.run_id }}
          api_key: ${{ env.NEON_API_KEY }}

      - name: Apply migrations and seed
        if: ${{ env.NEON_API_KEY != '' && env.NEON_PROJECT_ID != '' }}
        env:
          DATABASE_URL: ${{ steps.neon-branch.outputs.db_url }}
          DIRECT_URL: ${{ steps.neon-branch.outputs.db_url }}
        run: |
          npx prisma migrate deploy
          npx tsx prisma/seed.ts

      - name: Install Playwright browsers
        if: ${{ env.NEON_API_KEY != '' && env.NEON_PROJECT_ID != '' }}
        run: npx playwright install --with-deps chromium

      - name: Run E2E specs
        if: ${{ env.NEON_API_KEY != '' && env.NEON_PROJECT_ID != '' }}
        env:
          DATABASE_URL: ${{ steps.neon-branch.outputs.db_url }}
          DIRECT_URL: ${{ steps.neon-branch.outputs.db_url }}
        run: npx playwright test

      - name: Upload Playwright report
        if: ${{ env.NEON_API_KEY != '' && env.NEON_PROJECT_ID != '' && !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Delete ephemeral Neon branch
        if: ${{ env.NEON_API_KEY != '' && env.NEON_PROJECT_ID != '' && always() }}
        uses: neondatabase/delete-branch-action@v3
        with:
          project_id: ${{ env.NEON_PROJECT_ID }}
          branch: ${{ steps.neon-branch.outputs.branch_id }}
          api_key: ${{ env.NEON_API_KEY }}

  # Runs only after a merge to main, and only once build+e2e are green.
  # Vercel's own git integration (if connected to this repo) would deploy
  # every push on its own — this step is for the case where deploys are
  # driven from CI instead, or as an explicit, auditable "we deployed
  # because CI passed" step. Requires VERCEL_TOKEN / VERCEL_ORG_ID /
  # VERCEL_PROJECT_ID (see DEPLOYMENT.md); skips cleanly if unset.
  deploy:
    runs-on: ubuntu-latest
    needs: [build, e2e]
    if: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' }}
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Checkout
        if: ${{ env.VERCEL_TOKEN != '' }}
        uses: actions/checkout@v4

      - name: Setup Node.js
        if: ${{ env.VERCEL_TOKEN != '' }}
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Pull Vercel environment
        if: ${{ env.VERCEL_TOKEN != '' }}
        run: npx vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build via Vercel
        if: ${{ env.VERCEL_TOKEN != '' }}
        run: npx vercel build --prod --token="$VERCEL_TOKEN"

      - name: Deploy prebuilt output
        if: ${{ env.VERCEL_TOKEN != '' }}
        run: npx vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
